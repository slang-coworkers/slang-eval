# Eval CI for slang-coworkers/slang-eval, the fork the eval fixer coworker opens its
# PRs on. One GitHub-hosted Linux job builds Slang in Release and runs the CPU test
# suite the way upstream's test-linux-release-gcc-x86_64-cpu tier does. It runs on
# draft PRs too, because every eval PR is a draft. The eval runner reads the check
# run named "eval-ci" on the PR head as the trial's reward: success → 1, failure → 0.
#
# The trigger is pull_request_target, not pull_request: a fixer branch starts from the
# task's base commit, which is usually newer than the fork's master and often conflicts
# with it, and GitHub does not run pull_request workflows for a PR with a merge
# conflict. pull_request_target runs from the base branch regardless, and the job
# checks out the PR head commit explicitly. Only this fork's own eval bot opens PRs
# here, and the token is read-only.
name: Eval CI

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: eval-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval-ci:
    name: eval-ci
    runs-on: ubuntu-22.04
    timeout-minutes: 170
    steps:
      - name: Check out the PR head
        # The head commit, not the merge with the fork's master: the fixer's branch
        # starts from the task's recorded base commit and must be judged as it is.
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev
          cmake --version
          ninja --version

      - name: Configure and build Release
        run: |
          cmake --preset default --fresh
          cmake --build --preset release > build.log 2>&1 || { tail -200 build.log; exit 1; }

      - name: Run the tests the PR adds or changes
        # Quick, loud signal before the full suite: every .slang file under tests/
        # that differs from the fork's master tip.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          export SLANG_DISABLE_AVX512=1
          if [[ -z "$BASE_SHA" ]]; then echo "no PR base; skipping"; exit 0; fi
          git fetch --no-tags origin "$BASE_SHA" || true
          base=$(git merge-base "$BASE_SHA" HEAD || echo "$BASE_SHA")
          mapfile -t changed < <(git diff --name-only "$base" HEAD -- tests | grep -E '\.slang$' || true)
          if [[ ${#changed[@]} -eq 0 ]]; then echo "no changed .slang tests"; exit 0; fi
          printf 'changed test: %s\n' "${changed[@]}"
          ./build/Release/bin/slang-test -api cpu+llvm -expected-failure-list tests/expected-failure-github.txt \
            -expected-failure-list tests/expected-failure-no-gpu.txt -expected-failure-list tests/expected-failure-linux.txt \
            -skip-reference-image-generation "${changed[@]}"

      - name: Run the task's reference tests from the bank
        # The real signal: the regression tests the maintainers' own fix shipped with,
        # taken from slang-eval-tasks for the task named in the branch. They overwrite
        # anything the agent wrote at the same paths, so the agent cannot pass by editing
        # expected outputs. Any failing reference file fails the job. GPU-bound files are
        # skipped, since this runner has no GPU.
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          export SLANG_DISABLE_AVX512=1
          n=$(grep -oE 'slang-[0-9]+' <<<"$HEAD_REF" | head -1 | cut -d- -f2)
          if [[ -z "$n" ]]; then echo "no task id in branch '$HEAD_REF'; nothing to check"; exit 0; fi
          git clone -q --depth 1 https://github.com/slang-coworkers/slang-eval-tasks /tmp/bank
          task=/tmp/bank/tasks/fixer/slang-$n
          if [[ ! -d "$task" ]]; then echo "::error::no fixer task slang-$n in the bank"; exit 1; fi
          cp -R "$task/tests/reference/." .
          mapfile -t files < <(python3 - "$task/task.toml" <<'PY'
          import sys, tomllib
          md = tomllib.load(open(sys.argv[1], "rb"))["metadata"]
          gpu = set(md.get("gpu_tests", []))
          print("\n".join(f for f in md["runnable_tests"] if f not in gpu))
          PY
          )
          if [[ ${#files[@]} -eq 0 ]]; then echo "::warning::every reference test of slang-$n needs a GPU; nothing runnable here"; exit 0; fi
          printf 'reference test: %s\n' "${files[@]}"
          ./build/Release/bin/slang-test -v -api cpu+llvm "${files[@]}" > reference-tests.log 2>&1 || true
          pass=0; fail=0
          for f in "${files[@]}"; do
            p=$(grep -c "^passed test: '$f" reference-tests.log || true)
            q=$(grep -c "^FAILED test: '$f" reference-tests.log || true)
            if [[ "$q" -eq 0 && "$p" -gt 0 ]]; then pass=$((pass+1)); echo "PASS $f"; else fail=$((fail+1)); echo "FAIL $f (passed=$p failed=$q)"; fi
          done
          echo "reference tests for slang-$n: $pass passed, $fail failed of ${#files[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$fail" -gt 0 ]]; then grep -E "^(FAILED|passed|ignored) test:" reference-tests.log | head -40; exit 1; fi

      - name: Run the CPU test suite
        run: |
          export SLANG_DISABLE_AVX512=1
          ./build/Release/bin/slang-test -api cpu+llvm -use-test-server -server-count 4 \
            -expected-failure-list tests/expected-failure-github.txt \
            -expected-failure-list tests/expected-failure-no-gpu.txt \
            -expected-failure-list tests/expected-failure-linux.txt \
            -skip-reference-image-generation -show-adapter-info
